<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — Japan, Slowly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Sora:wght@800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100dvh; margin: 0; place-items: center; padding: 24px; color: #111827; background: #f9fafb; font-family: "Plus Jakarta Sans", system-ui, sans-serif; text-align: center; }
    .card { max-width: 420px; padding: 36px 28px; border: 1px solid rgba(0,0,0,.05); border-radius: 16px; background: rgba(255,255,255,.9); box-shadow: 0 4px 24px rgba(0,0,0,.06); }
    .eyebrow { margin: 0 0 8px; color: #2c6db4; font-size: .6875rem; font-weight: 600; letter-spacing: .01em; text-transform: none; }
    h1 { margin: 0 0 10px; font-family: "Sora", system-ui, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -.035em; }
    p { margin: 0 0 22px; color: #6b7280; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; color: #fff; border-radius: 12px; background: linear-gradient(90deg, #2c6db4, #006469); box-shadow: 0 4px 14px rgba(0,173,181,.35); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Error 404</p>
    <h1>Lost in Japan?</h1>
    <p>That page does not exist. Head back to the plan.</p>
    <a href="/">Back to the itinerary</a>
  </main>
</body>
</html>
